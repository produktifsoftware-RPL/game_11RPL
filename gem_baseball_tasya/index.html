<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gem Baseball 3D</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root{
  --bg1:#07111f;
  --bg2:#10283a;
  --glass:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.15);
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  overflow-x:hidden;
  color:#fff;
  font-family:Inter,system-ui,sans-serif;
  background:
    radial-gradient(circle at 15% 20%,rgba(0,220,170,.2),transparent 28%),
    radial-gradient(circle at 85% 75%,rgba(30,120,255,.25),transparent 30%),
    linear-gradient(145deg,var(--bg1),var(--bg2));
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.13;
  background-image:
    linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);
  background-size:40px 40px;
}
.game-shell{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px 15px;
}
.layout{
  width:min(1100px,100%);
  display:grid;
  grid-template-columns:210px minmax(300px,620px) 210px;
  gap:20px;
  align-items:center;
}
.glass{
  background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.035));
  border:1px solid var(--line);
  border-radius:23px;
  box-shadow:0 28px 70px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.12);
  backdrop-filter:blur(18px);
}
.side{padding:18px}
.brand{
  font-weight:900;
  letter-spacing:1.5px;
  margin-bottom:16px;
}
.stat{
  padding:12px;
  border-radius:15px;
  background:rgba(0,0,0,.2);
  border:1px solid rgba(255,255,255,.08);
  margin-bottom:10px;
}
.stat small{
  display:block;
  color:#aebbd0;
  text-transform:uppercase;
  font-size:.68rem;
  letter-spacing:1px;
}
.stat strong{font-size:1.4rem}
.field-wrap{
  position:relative;
  padding:14px;
  border-radius:29px;
  background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.035));
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 35px 90px rgba(0,0,0,.5),inset 0 2px rgba(255,255,255,.12);
}
#gameCanvas{
  display:block;
  width:100%;
  max-width:600px;
  aspect-ratio:16/10;
  margin:auto;
  border-radius:19px;
  background:#07111a;
  box-shadow:inset 0 0 40px rgba(0,0,0,.8);
}
.zone-title{
  color:#aebbd0;
  font-size:.72rem;
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom:8px;
}
.target-box{
  position:relative;
  height:125px;
  border-radius:17px;
  background:rgba(0,0,0,.2);
  border:1px solid rgba(255,255,255,.08);
  overflow:hidden;
}
.target{
  position:absolute;
  width:48px;
  height:48px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.8);
  box-shadow:0 0 20px rgba(0,220,255,.55);
  transform:translate(-50%,-50%);
}
.target:after{
  content:"";
  position:absolute;
  inset:9px;
  border:2px solid rgba(255,255,255,.55);
  border-radius:50%;
}
.controls{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:14px;
}
.control-btn{
  height:48px;
  border:1px solid rgba(255,255,255,.16);
  border-radius:13px;
  background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.045));
  color:#fff;
  font-size:1.1rem;
  font-weight:900;
  box-shadow:0 9px 18px rgba(0,0,0,.25),inset 0 1px rgba(255,255,255,.12);
  transition:transform .08s,filter .08s;
  touch-action:manipulation;
}
.control-btn:active{transform:translateY(2px) scale(.96);filter:brightness(1.25)}
.lock{grid-column:2}
.hit{grid-column:1/4}
.hint{
  color:#aebbd0;
  font-size:.73rem;
  line-height:1.6;
  margin-top:13px;
}
.key{
  display:inline-block;
  padding:2px 6px;
  border-radius:5px;
  border:1px solid rgba(255,255,255,.13);
  background:rgba(255,255,255,.1);
  color:#fff;
}
.modal-content{
  color:#fff;
  background:linear-gradient(145deg,#10283a,#08121f);
  border:1px solid rgba(255,255,255,.16);
  border-radius:25px;
  box-shadow:0 35px 90px rgba(0,0,0,.65);
}
.btn-game{
  border:0;
  color:#fff;
  font-weight:900;
  border-radius:13px;
  padding:11px 23px;
  background:linear-gradient(135deg,#00bfa5,#1877ff);
  box-shadow:0 12px 30px rgba(0,180,255,.25);
}
@media(max-width:850px){
  .layout{grid-template-columns:180px minmax(300px,1fr) 180px;gap:10px}
  .side{padding:12px}
}
@media(max-width:650px){
  .layout{grid-template-columns:1fr 1fr}
  .field-wrap{grid-column:1/3;grid-row:1}
  .left{grid-column:1;grid-row:2}
  .right{grid-column:2;grid-row:2}
}
</style>
</head>

<body>
<div class="game-shell">
  <div class="layout">

    <!-- KIRI -->
    <aside class="glass side left">
      <div class="brand">⚾ GEM BASEBALL</div>
      <div class="stat"><small>Score</small><strong id="score">0</strong></div>
      <div class="stat"><small>Hits</small><strong id="hits">0</strong></div>
      <div class="stat"><small>Strike</small><strong id="strikes">0 / 3</strong></div>
      <div class="stat"><small>Level</small><strong id="level">1</strong></div>
      <button class="btn btn-sm btn-outline-light w-100 mt-2" id="pauseBtn">⏸ Pause</button>
    </aside>

    <!-- LAPANGAN -->
    <main class="field-wrap">
      <canvas id="gameCanvas" width="640" height="400"></canvas>
    </main>

    <!-- KANAN -->
    <aside class="glass side right">
      <div class="zone-title">Target Sasaran</div>
      <div class="target-box">
        <div class="target" id="target"></div>
      </div>

      <div class="controls">
        <button class="control-btn" id="leftBtn">◀</button>
        <button class="control-btn lock" id="lockBtn">🔒</button>
        <button class="control-btn" id="rightBtn">▶</button>
        <button class="control-btn hit" id="hitBtn">⬇️ PUKUL BOLA</button>
      </div>

      <div class="hint">
        <div><span class="key">←</span> <span class="key">→</span> geser sasaran</div>
        <div><span class="key">↓</span> pukul bola</div>
        <div><span class="key">SPACE</span> kunci sasaran</div>
      </div>
    </aside>

  </div>
</div>

<!-- START -->
<div class="modal fade" id="startModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-center p-4">
      <div class="modal-body">
        <div style="font-size:4rem">⚾</div>
        <h2 class="fw-black fw-bold">GEM BASEBALL</h2>
        <p class="text-secondary mb-4">
          Geser sasaran, kunci dengan SPACE, lalu pukul bola tepat waktu!
        </p>
        <button class="btn-game" id="startBtn">🚀 MULAI GAME</button>
      </div>
    </div>
  </div>
</div>

<!-- GAME OVER -->
<div class="modal fade" id="gameOverModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-center p-4">
      <div class="modal-body">
        <div style="font-size:4rem">💥</div>
        <h2 class="fw-bold">GAME OVER</h2>
        <p class="text-secondary">Tiga strike! Permainan selesai.</p>
        <div class="row g-2 mb-4">
          <div class="col"><div class="stat mb-0"><small>Score</small><strong id="finalScore">0</strong></div></div>
          <div class="col"><div class="stat mb-0"><small>Hits</small><strong id="finalHits">0</strong></div></div>
        </div>
        <button class="btn-game" id="restartBtn">🔄 MAIN LAGI</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");
const targetEl=document.getElementById("target");

const startModal=new bootstrap.Modal(document.getElementById("startModal"));
const gameOverModal=new bootstrap.Modal(document.getElementById("gameOverModal"));

let running=false,paused=false,locked=false;
let score=0,hits=0,strikes=0,level=1;
let targetX=320;
let ball={x:70,y:280,vx:0,vy:0,r:10,active:false};
let swing=false,swingT=0;
let flash=0;
let lastTime=0;
let raf=0;
let targetVelocity=0;

function reset(){
  running=true;
  paused=false;
  locked=false;
  score=0;hits=0;strikes=0;level=1;
  targetX=320;
  ball={x:70,y:280,vx:0,vy:0,r:10,active:false};
  swing=false;swingT=0;flash=0;
  updateStats();
  updateTarget();
  lastTime=performance.now();
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(loop);
  schedulePitch();
}

function updateStats(){
  document.getElementById("score").textContent=score.toLocaleString("id-ID");
  document.getElementById("hits").textContent=hits;
  document.getElementById("strikes").textContent=strikes+" / 3";
  document.getElementById("level").textContent=level;
}

function updateTarget(){
  const box=targetEl.parentElement;
  const ratio=Math.max(0,Math.min(1,targetX/canvas.width));
  targetEl.style.left=(ratio*100)+"%";
  targetEl.style.top="50%";
  targetEl.style.borderColor=locked?"#00ffbf":"rgba(255,255,255,.8)";
  targetEl.style.boxShadow=locked
    ?"0 0 25px rgba(0,255,190,.8)"
    :"0 0 20px rgba(0,220,255,.55)";
}

function moveTarget(dx){
  if(!running||paused||locked)return;
  targetX=Math.max(170,Math.min(510,targetX+dx));
  updateTarget();
}

function toggleLock(){
  if(!running||paused)return;
  locked=!locked;
  updateTarget();
}

function schedulePitch(){
  if(!running)return;
  const delay=Math.max(650,1300-(level-1)*70);
  setTimeout(()=>{
    if(running&&!paused&&!ball.active){
      launchBall();
    }
    if(running)schedulePitch();
  },delay);
}

function launchBall(){
  ball.x=70;
  ball.y=280;
  ball.vx=270+level*22;
  ball.vy=-25;
  ball.active=true;
}

function swingBat(){
  if(!running||paused||swing)return;
  swing=true;
  swingT=0;
  if(ball.active){
    const dx=ball.x-targetX;
    const distance=Math.abs(dx);
    if(distance<48 && ball.x>250 && ball.x<470){
      hitBall(distance);
    }
  }
}

function hitBall(distance){
  ball.active=false;
  hits++;
  const quality=Math.max(0,1-distance/48);
  const gained=Math.round(100+quality*400+level*30);
  score+=gained;
  level=Math.min(20,Math.floor(hits/5)+1);
  flash=1;
  updateStats();
}

function missBall(){
  if(!ball.active)return;
  ball.active=false;
  strikes++;
  locked=false;
  updateTarget();
  if(strikes>=3){
    endGame();
  }
}

function endGame(){
  running=false;
  document.getElementById("finalScore").textContent=score.toLocaleString("id-ID");
  document.getElementById("finalHits").textContent=hits;
  setTimeout(()=>gameOverModal.show(),180);
}

function togglePause(){
  if(!running)return;
  paused=!paused;
  document.getElementById("pauseBtn").textContent=paused?"▶ Lanjut":"⏸ Pause";
}

function drawField(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const sky=ctx.createLinearGradient(0,0,0,canvas.height);
  sky.addColorStop(0,"#081b32");
  sky.addColorStop(.5,"#14516b");
  sky.addColorStop(1,"#142b20");
  ctx.fillStyle=sky;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // lampu stadium
  for(let i=0;i<5;i++){
    ctx.fillStyle="rgba(255,255,255,.7)";
    ctx.beginPath();
    ctx.arc(80+i*125,65,5,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.08)";
    ctx.beginPath();
    ctx.arc(80+i*125,65,45,0,Math.PI*2);
    ctx.fill();
  }

  // rumput
  ctx.fillStyle="#123d2b";
  ctx.fillRect(0,245,canvas.width,155);

  // garis lapangan
  ctx.strokeStyle="rgba(255,255,255,.55)";
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(320,360);
  ctx.lineTo(535,245);
  ctx.moveTo(320,360);
  ctx.lineTo(105,245);
  ctx.stroke();

  // home plate
  ctx.fillStyle="#e8e8e8";
  ctx.beginPath();
  ctx.moveTo(300,350);ctx.lineTo(340,350);ctx.lineTo(332,365);
  ctx.lineTo(308,365);ctx.closePath();ctx.fill();

  // pitcher
  ctx.fillStyle="#d8b28a";
  ctx.beginPath();ctx.arc(325,220,18,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#26354b";
  ctx.fillRect(310,238,30,48);

  // batter
  ctx.fillStyle="#d8b28a";
  ctx.beginPath();ctx.arc(135,290,14,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#182238";
  ctx.fillRect(123,304,25,48);

  // bat
  ctx.save();
  ctx.translate(145,310);
  const angle=swing?(-1.15+swingT*3.0):-.35;
  ctx.rotate(angle);
  ctx.fillStyle="#d99b4a";
  ctx.fillRect(0,-5,85,10);
  ctx.fillStyle="#f0c47a";
  ctx.fillRect(70,-7,25,14);
  ctx.restore();

  // target line
  ctx.save();
  ctx.setLineDash([8,8]);
  ctx.strokeStyle=locked?"rgba(0,255,190,.65)":"rgba(0,220,255,.3)";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(targetX,205);
  ctx.lineTo(targetX,335);
  ctx.stroke();
  ctx.restore();

  // target
  ctx.strokeStyle=locked?"#00ffbf":"#54e8ff";
  ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(targetX,270,35,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(targetX,270,12,0,Math.PI*2);ctx.stroke();

  // ball
  if(ball.active){
    const g=ctx.createRadialGradient(ball.x-3,ball.y-3,2,ball.x,ball.y,ball.r);
    g.addColorStop(0,"#fff");
    g.addColorStop(1,"#b9c5d0");
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="rgba(200,30,30,.8)";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(ball.x,ball.y,6,.4,2.4);ctx.stroke();
  }

  // flash hit
  if(flash>0){
    ctx.fillStyle=`rgba(0,255,190,${flash*.18})`;
    ctx.fillRect(0,0,canvas.width,canvas.height);
  }
}

function loop(time){
  if(!running)return;

  const dt=Math.min((time-lastTime)/1000,.033);
  lastTime=time;

  if(!paused){
    if(ball.active){
      ball.x+=ball.vx*dt;
      ball.y+=ball.vy*dt;
      ball.vy+=35*dt;

      if(ball.x>590)missBall();
    }

    if(swing){
      swingT+=dt*4.5;
      if(swingT>=1){
        swing=false;swingT=0;
      }
    }

    flash=Math.max(0,flash-dt*2.7);
  }

  drawField();
  raf=requestAnimationFrame(loop);
}

// keyboard
document.addEventListener("keydown",e=>{
  if(!running)return;
  if(["ArrowLeft","ArrowRight","ArrowDown"," "].includes(e.key))e.preventDefault();

  if(e.key==="ArrowLeft")moveTarget(-16);
  else if(e.key==="ArrowRight")moveTarget(16);
  else if(e.key==="ArrowDown")swingBat();
  else if(e.key===" ")toggleLock();
  else if(e.key.toLowerCase()==="p")togglePause();
});

// tombol
document.getElementById("leftBtn").addEventListener("click",()=>moveTarget(-16));
document.getElementById("rightBtn").addEventListener("click",()=>moveTarget(16));
document.getElementById("hitBtn").addEventListener("click",swingBat);
document.getElementById("lockBtn").addEventListener("click",toggleLock);
document.getElementById("pauseBtn").addEventListener("click",togglePause);

function repeat(id,action){
  const b=document.getElementById(id);
  let timer;
  const start=e=>{
    e.preventDefault();action();
    timer=setInterval(action,85);
  };
  const stop=()=>{
    clearInterval(timer);timer=null;
  };
  b.addEventListener("pointerdown",start);
  b.addEventListener("pointerup",stop);
  b.addEventListener("pointerleave",stop);
  b.addEventListener("pointercancel",stop);
}
repeat("leftBtn",()=>moveTarget(-16));
repeat("rightBtn",()=>moveTarget(16));

// modal
document.getElementById("startBtn").addEventListener("click",()=>{
  startModal.hide();
  setTimeout(reset,250);
});
document.getElementById("restartBtn").addEventListener("click",()=>{
  gameOverModal.hide();
  setTimeout(reset,250);
});

// awal
updateTarget();
drawField();
startModal.show();
</script>
</body>
</html>
