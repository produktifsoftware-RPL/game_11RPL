<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Arena Multiplayer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  overflow:hidden;
  background:#050816;
  font-family:Arial,sans-serif;
  color:white;
}
canvas{
  display:block;
  width:100vw;
  height:100vh;
}
#ui{
  position:fixed;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(10,15,35,.8);
  border:1px solid #334;
  border-radius:15px;
  padding:10px 20px;
  backdrop-filter:blur(10px);
  text-align:center;
  z-index:2;
}
#score{
  font-size:20px;
  font-weight:bold;
}
#info{
  font-size:12px;
  opacity:.7;
  margin-top:5px;
}
</style>
</head>
<body>

<div id="ui">
  <div id="score">P1: 0 | P2: 0 | P3: 0 | P4: 0</div>
  <div id="info">Ambil bintang sebanyak mungkin!</div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W, H;
function resize(){
  W = canvas.width = innerWidth * devicePixelRatio;
  H = canvas.height = innerHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  W = innerWidth;
  H = innerHeight;
}
addEventListener("resize", resize);
resize();

const keys = {};

addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
});

addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

const players = [
  {
    name:"P1", x:150,y:150,targetX:150,targetY:150,
    color:"#00e5ff", score:0,
    controls:["w","s","a","d"]
  },
  {
    name:"P2", x:W-150,y:H-150,targetX:W-150,targetY:H-150,
    color:"#ff3b81", score:0,
    controls:["arrowup","arrowdown","arrowleft","arrowright"]
  },
  {
    name:"P3", x:W-150,y:150,targetX:W-150,targetY:150,
    color:"#a855f7", score:0,
    controls:["i","k","j","l"]
  },
  {
    name:"P4", x:150,y:H-150,targetX:150,targetY:H-150,
    color:"#ffe600", score:0,
    controls:["t","g","f","h"]
  }
];

let stars = [];

function createStar(){
  return {
    x:80 + Math.random()*(W-160),
    y:100 + Math.random()*(H-160),
    r:10,
    pulse:Math.random()*Math.PI*2
  };
}

for(let i=0;i<5;i++) stars.push(createStar());

function movePlayer(p){
  let [up,down,left,right] = p.controls;
  let dx=0, dy=0;

  if(keys[up]) dy--;
  if(keys[down]) dy++;
  if(keys[left]) dx--;
  if(keys[right]) dx++;

  if(dx || dy){
    const len=Math.hypot(dx,dy);
    dx/=len;
    dy/=len;

    const speed=4.5;

    p.targetX += dx*speed;
    p.targetY += dy*speed;

    p.targetX=Math.max(30,Math.min(W-30,p.targetX));
    p.targetY=Math.max(70,Math.min(H-30,p.targetY));
  }

  // Smooth movement
  p.x += (p.targetX-p.x)*0.22;
  p.y += (p.targetY-p.y)*0.22;
}

function distance(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}

function update(){
  players.forEach(movePlayer);

  stars.forEach((star,index)=>{
    star.pulse += 0.08;

    players.forEach(p=>{
      if(distance(p,star)<30){
        p.score++;
        stars[index]=createStar();
      }
    });
  });

  document.getElementById("score").textContent =
    players.map(p=>`${p.name}: ${p.score}`).join(" | ");
}

function drawBackground(){
  ctx.fillStyle="#050816";
  ctx.fillRect(0,0,W,H);

  // Grid
  ctx.strokeStyle="rgba(80,100,180,.09)";
  ctx.lineWidth=1;

  const grid=50;

  for(let x=0;x<W;x+=grid){
    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,H);
    ctx.stroke();
  }

  for(let y=0;y<H;y+=grid){
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();
  }

  // Glow
  const g=ctx.createRadialGradient(
    W/2,H/2,50,
    W/2,H/2,Math.max(W,H)/1.2
  );
  g.addColorStop(0,"rgba(70,80,255,.08)");
  g.addColorStop(1,"rgba(0,0,0,.3)");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);
}

function drawStar(star){
  const pulse=1+Math.sin(star.pulse)*0.15;

  ctx.save();
  ctx.translate(star.x,star.y);
  ctx.scale(pulse,pulse);

  ctx.shadowBlur=25;
  ctx.shadowColor="#fff000";
  ctx.fillStyle="#fff000";

  ctx.beginPath();

  for(let i=0;i<10;i++){
    const angle=-Math.PI/2+i*Math.PI/5;
    const radius=i%2===0?star.r:star.r*.45;

    const x=Math.cos(angle)*radius;
    const y=Math.sin(angle)*radius;

    if(i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }

  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawPlayer(p){
  ctx.save();

  ctx.shadowBlur=25;
  ctx.shadowColor=p.color;
  ctx.fillStyle=p.color;

  ctx.beginPath();
  ctx.arc(p.x,p.y,18,0,Math.PI*2);
  ctx.fill();

  // Inner circle
  ctx.shadowBlur=0;
  ctx.fillStyle="rgba(255,255,255,.35)";
  ctx.beginPath();
  ctx.arc(p.x-5,p.y-6,5,0,Math.PI*2);
  ctx.fill();

  // Name
  ctx.font="bold 12px Arial";
  ctx.textAlign="center";
  ctx.fillStyle="white";
  ctx.fillText(p.name,p.x,p.y-28);

  ctx.restore();
}

function draw(){
  drawBackground();

  stars.forEach(drawStar);
  players.forEach(drawPlayer);
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
